<h1>Canister（キャニスター）</h1>
<p class="lead">コーヒー豆と一杯の抽出を、写真とともに記録するiPhoneアプリです。</p>
<ul><li>袋の写真や手入力から、コーヒー豆を記録できます。</li><li>抽出条件と使った道具を残し、カレンダーから振り返れます。</li><li>登録した道具の写真・仕様・メモを管理できます。</li></ul>
<p>ログインなしで利用できます。記録と写真は端末内に保存し、アプリ独自のクラウド同期・バックアップ機能はありません。</p>
